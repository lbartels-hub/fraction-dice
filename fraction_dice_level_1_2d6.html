<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Level 1 — Two 6-Sided Dice</title><style>
*{box-sizing:border-box} body{font-family:Arial,sans-serif;margin:0;background:#f7f7fb;color:#202124;display:flex;justify-content:center} main{width:min(720px,94vw);padding:28px 14px;text-align:center} h1{font-size:clamp(25px,5vw,38px);margin:8px 0} .sub{color:#60646c;margin:0 0 24px} .dice{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;margin:24px 0} .die{width:130px;height:130px;border:4px solid #333;border-radius:22px;background:white;display:flex;align-items:center;justify-content:center;font-size:58px;font-weight:800} .tag{font-size:14px;color:#666;margin-top:7px} button{border:0;border-radius:16px;padding:17px 44px;font-size:26px;font-weight:800;background:#3157d5;color:white;cursor:pointer;min-width:190px} button:focus{outline:4px solid #a9baff;outline-offset:3px} #result{min-height:190px;margin-top:28px;display:flex;align-items:center;justify-content:center;flex-direction:column} .frac{display:inline-flex;flex-direction:column;align-items:center;font-size:64px;font-weight:800;line-height:1} .num{padding:0 22px 10px;border-bottom:5px solid #222} .den{padding:10px 22px 0} .instruction{font-size:20px;margin-top:22px} .note{font-size:14px;color:#666;margin-top:28px}
</style></head><body><main><h1>🎲 Proper Fraction Dice</h1><p class="sub">Roll two 6-sided dice.</p><div class="dice"><div><div id="d1" class="die">?</div><div class="tag">6-sided die</div></div><div><div id="d2" class="die">?</div><div class="tag">6-sided die</div></div></div><button id="roll" type="button">🎲 ROLL</button><div id="result" aria-live="polite"><p class="instruction">Tap ROLL to make a proper fraction.</p></div><p class="note">Smaller number = numerator • Larger number = denominator • Doubles automatically reroll</p></main><script>
const s1=6,s2=6; const d1=document.getElementById('d1'),d2=document.getElementById('d2'),r=document.getElementById('result');document.getElementById('roll').addEventListener('click',()=>{let a,b;do{a=Math.floor(Math.random()*s1)+1;b=Math.floor(Math.random()*s2)+1}while(a===b);d1.textContent=a;d2.textContent=b;const n=Math.min(a,b),d=Math.max(a,b);r.innerHTML=`<div style="font-size:15px;font-weight:700;color:#666;margin-bottom:12px">YOUR PROPER FRACTION</div><div class="frac" aria-label="${n} over ${d}"><span class="num">${n}</span><span class="den">${d}</span></div><p class="instruction">Write this fraction on your Seesaw sheet.</p>`});
</script></body></html>
